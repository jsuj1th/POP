{% extends "observations/base.html" %}

{% block page_title %}Log In{% endblock %}
{% block heading_text %}Log In{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-9 col-md-6 col-lg-4">

    <div class="card tamu-card" role="region" aria-labelledby="login-heading">
      <div class="card-header text-center py-3" id="login-heading">
        Log In
      </div>
      <div class="card-body p-4">

        {% if error %}
          <div class="tamu-alert tamu-alert-error mb-3" role="alert" aria-live="assertive">
            <strong>Error:</strong> {{ error }}
          </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}" novalidate>
          {% csrf_token %}

          <div class="mb-3">
            <label for="username" class="form-label">
              Username
              <span class="text-required" aria-hidden="true">*</span>
              <span class="visually-hidden">(required)</span>
            </label>
            <input type="text"
                   id="username"
                   name="username"
                   class="form-control tamu-input"
                   autocomplete="username"
                   required
                   aria-required="true">
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">
              Password
              <span class="text-required" aria-hidden="true">*</span>
              <span class="visually-hidden">(required)</span>
            </label>
            <input type="password"
                   id="password"
                   name="password"
                   class="form-control tamu-input"
                   autocomplete="current-password"
                   required
                   aria-required="true">
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-tamu">
              Enter
            </button>
          </div>

        </form>

        <div class="divider my-4">
          <span class="divider-text">or</span>
        </div>

        <div class="d-grid">
          <a href="{% url 'oidc_authentication_init' %}" class="btn btn-tamu">
            Sign in with TAMU
          </a>
        </div>
      </div>
    </div>

  </div>
</div>
{% endblock %}
