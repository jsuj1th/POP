{% extends "observations/base.html" %}

{% block content %}
<div class="login-box">
  <div class="login-header">LOG IN</div>
  <div class="login-body">
    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="form-row">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" autocomplete="username" style="width: 160px;">
      </div>
      <div class="form-row">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" autocomplete="current-password" style="width: 160px;">
      </div>
      <button type="submit" class="enter-btn">ENTER</button>
    </form>
  </div>
</div>
{% endblock %}
