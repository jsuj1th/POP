<!DOCTYPE html>
<html>
<head>
    <title>Pedagogical Observation Protocol</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #7aacdb; font-family: Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .top-bar { background-color: #e6a817; height: 12px; }
        .gold-bar { background-color: #e6a817; padding: 8px 0; text-align: center; }
        .gold-bar a { color: white; text-decoration: none; margin: 0 12px; font-size: 14px; }
        .gold-bar a:hover { text-decoration: underline; }
        .main-content { background-color: white; max-width: 900px; margin: 0 auto; width: 100%; padding: 20px; flex: 1; }
        h1.page-title { text-align: center; letter-spacing: 4px; font-size: 16px; color: #333; margin: 15px 0; }
        hr.title-line { border: none; border-top: 1px solid #7aacdb; margin: 0 0 20px 0; }
        .select-panel { border: 1px solid #ccc; max-width: 380px; margin: 0 auto; }
        .select-panel-header { background-color: #6db33f; color: white; text-align: center; padding: 7px; letter-spacing: 3px; font-size: 13px; font-weight: bold; }
        .select-panel-body { background-color: #ffffcc; padding: 20px 30px; }
        .select-panel-body .welcome { text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 14px; }
        .form-row { display: flex; align-items: center; margin-bottom: 10px; }
        .form-row label { width: 70px; font-size: 14px; text-align: right; margin-right: 10px; }
        .form-row select, .form-row input { font-size: 14px; padding: 3px; border: 1px solid #999; }
        .enter-btn { display: inline-block; margin: 15px auto; padding: 5px 20px; font-size: 14px; background: #f0f0f0; border: 1px solid #999; cursor: pointer; letter-spacing: 2px; }
        .enter-btn:hover { background: #e0e0e0; }
        .complete-btn { background: #4a7c3f; color: white; border-color: #3a6230; }
        .complete-btn:hover { background: #3a6230; }
        .completion-box { max-width: 480px; margin: 30px auto; border: 1px solid #ccc; text-align: center; }
        .completion-box-header { background: #4a7c3f; color: white; padding: 10px; letter-spacing: 3px; font-size: 13px; font-weight: bold; }
        .completion-box-body { background: #ffffcc; padding: 30px; }
        .completion-box-body p { font-size: 14px; margin-bottom: 15px; }
        .download-btn { display: inline-block; padding: 8px 24px; background: #6db33f; color: white; border: none; cursor: pointer; font-size: 14px; text-decoration: none; letter-spacing: 1px; }
        .download-btn:hover { background: #5a9e30; color: white; }
        .page-wrapper { display: flex; flex-direction: column; min-height: 100vh; }
        .content-area { flex: 1; background: white; }
        .footer-spacer { flex: 1; background: #7aacdb; }
        /* Observation form styles */
        .obs-info { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 640px; margin: 10px auto 20px; font-size: 14px; background: #f0f6ff; border: 1px solid #c0d4ec; border-radius: 4px; padding: 10px 16px; }
        .obs-panel { border: 2px solid #7aacdb; max-width: 520px; margin: 0 auto; border-radius: 4px; }
        .obs-panel-header { background-color: #4d6fa3; color: white; text-align: center; padding: 10px; letter-spacing: 3px; font-size: 13px; font-weight: bold; }
        .obs-panel-body { padding: 24px 36px; }
        .obs-form-row { display: flex; align-items: center; margin-bottom: 14px; }
        .obs-form-row label { width: 240px; font-size: 13px; font-weight: 600; color: #222; text-align: right; margin-right: 12px; line-height: 1.4; }
        .select-wrapper { position: relative; }
        .obs-form-row select, .obs-select {
            font-size: 14px; padding: 6px 10px; border: 2px solid #7aacdb;
            border-radius: 3px; min-width: 130px; background: white;
            color: #111; cursor: pointer;
            /* Ensure enough touch target height */
            min-height: 36px;
        }
        .obs-form-row select:focus, .obs-select:focus {
            outline: 3px solid #e6a817;
            outline-offset: 2px;
            border-color: #4d6fa3;
        }
        .obs-form-row select:hover, .obs-select:hover { border-color: #4d6fa3; }
        .field-error { color: #b00020; font-size: 12px; margin-left: 252px; margin-bottom: 6px; font-weight: 600; }
        /* "Mark as Completed" button in nav bar */
        .complete-nav-btn {
            background: #2d5016; color: white; border: 2px solid #1a3009;
            padding: 5px 14px; font-size: 13px; cursor: pointer;
            border-radius: 3px; font-weight: bold; letter-spacing: 0.5px;
        }
        .complete-nav-btn:hover { background: #1a3009; }
        .complete-nav-btn:focus { outline: 3px solid white; outline-offset: 2px; }
        /* Focus styles for nav links */
        .gold-bar a:focus { outline: 3px solid white; outline-offset: 2px; border-radius: 2px; }
        .enter-btn:focus { outline: 3px solid #4d6fa3; outline-offset: 2px; }
        .add-obs-btn { display:inline-block; padding:4px 14px; background:#4d6fa3; color:white; font-size:12px; font-weight:600; text-decoration:none; border-radius:3px; }
        .add-obs-btn:hover { background:#2d4f83; color:white; }
        .add-obs-btn:focus { outline:3px solid #e6a817; outline-offset:2px; }
        .edit-link { color: #4d6fa3; font-size: 13px; text-decoration: none; font-weight: 600; white-space: nowrap; }
        .edit-link:hover { color: #2d4f83; text-decoration: underline; }
        .edit-link:focus { outline: 2px solid #4d6fa3; outline-offset: 2px; border-radius: 2px; }
        /* Reports table */
        .reports-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 20px; }
        .reports-table th { background: #7090b0; color: white; padding: 6px 8px; text-align: left; }
        .reports-table td { padding: 5px 8px; border-bottom: 1px solid #ddd; }
        .reports-table tr:nth-child(even) { background: #f5f5f5; }
        .download-btn { padding: 6px 18px; background: #6db33f; color: white; border: none; cursor: pointer; font-size: 14px; margin-bottom: 15px; text-decoration: none; display: inline-block; }
        .download-btn:hover { background: #5a9e33; }
        .messages { max-width: 500px; margin: 10px auto; }
        .message-success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; padding: 8px 12px; font-size: 13px; margin-bottom: 5px; }
        .message-error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; padding: 8px 12px; font-size: 13px; margin-bottom: 5px; }
        .login-box { max-width: 300px; margin: 40px auto; border: 1px solid #ccc; }
        .login-header { background: #6db33f; color: white; text-align: center; padding: 8px; letter-spacing: 3px; font-size: 13px; font-weight: bold; }
        .login-body { background: #ffffcc; padding: 25px 30px; }
        .login-body .form-row label { width: 80px; }
        .error-msg { color: red; font-size: 13px; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>
<div class="page-wrapper">
  <div class="top-bar"></div>
  {% block topnav %}{% endblock %}
  <div class="content-area">
    <div class="main-content">
      <h1 class="page-title">{% block page_title %}PEDAGOGICAL OBSERVATION PROTOCOL{% endblock %}</h1>
      <hr class="title-line">
      {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="message-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </div>
  </div>
  <div class="gold-bar">
    {% block footer %}{% endblock %}
  </div>
</div>
</body>
</html>
